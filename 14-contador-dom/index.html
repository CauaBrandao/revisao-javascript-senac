<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Contador Interativo</title>
  <link rel="stylesheet" href="./css/style.css" />
</head>
<body>
  <main class="counter">
    <h1>Contador</h1>

    <p id="counter-value" class="counter__value">0</p>

    <div class="counter__actions">
      <button id="decrement-button">Decrementar</button>
      <button id="reset-button">Resetar</button>
      <button id="increment-button">Incrementar</button>
    </div>

    <p id="counter-message"></p>
  </main>

  <script src="./js/app.js"></script>
</body>
</html>
